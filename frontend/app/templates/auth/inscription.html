{% extends "base.html" %}

{% block title %}Inscription — GearShare{% endblock %}

{% block content %}
<h1>Créer un compte</h1>

{% for message in messages %}
  <p class="alerte alerte-erreur">{{ message }}</p>
{% endfor %}

<form method="post" action="/inscription">
  <label for="email">Email</label>
  <input
    type="email"
    id="email"
    name="email"
    autocomplete="email"
    value="{{ saisie.email if saisie else '' }}"
    required
  >

  <label for="display_name">Nom affiché</label>
  <input
    type="text"
    id="display_name"
    name="display_name"
    value="{{ saisie.display_name if saisie else '' }}"
    required
    minlength="1"
    maxlength="80"
  >

  <label for="password">Mot de passe</label>
  <input
    type="password"
    id="password"
    name="password"
    autocomplete="new-password"
    required
    minlength="12"
    maxlength="128"
  >

  <button type="submit">S'inscrire</button>
</form>

<p><a href="/connexion">Se connecter</a></p>
{% endblock %}
