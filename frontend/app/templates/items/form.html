{% extends "base.html" %}

{% block title %}Proposer un objet — GearShare{% endblock %}

{% block content %}
<h1>Proposer un objet</h1>

{% if messages %}
  <div class="alerte alerte-erreur">
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}

<form method="post" action="/items">
  <label for="titre">Titre</label>
  <input
    type="text"
    id="titre"
    name="titre"
    value="{{ saisie.titre if saisie else '' }}"
    required
    minlength="3"
  >

  <label for="description">Description</label>
  <textarea id="description" name="description">{{ saisie.description if saisie else '' }}</textarea>

  <label for="tarif_jour">Tarif par jour</label>
  <input
    type="number"
    id="tarif_jour"
    name="tarif_jour"
    value="{{ saisie.tarif_jour if saisie else '' }}"
    required
    min="0.01"
    step="0.01"
  >

  <label for="disponible">
    <input
      type="checkbox"
      id="disponible"
      name="disponible"
      value="true"
      {% if saisie.disponible %}checked{% endif %}
    >
    Disponible
  </label>

  <button type="submit">Créer l'objet</button>
</form>
{% endblock %}
