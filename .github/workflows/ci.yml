name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check backend frontend

  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://gearshare:gearshare@localhost:5432/gearshare
      TEST_DATABASE_URL: postgresql+psycopg://gearshare:gearshare@localhost:5432/gearshare_test
      JWT_SECRET: ci-test-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gearshare
          POSTGRES_PASSWORD: gearshare
          POSTGRES_DB: gearshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gearshare -d gearshare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: PGPASSWORD=gearshare createdb -h localhost -U gearshare gearshare_test
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: pytest -q
        working-directory: backend

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
